name: Mirror update JSON to Gitee (no APK)

on:
  push:
    branches: [fireflymovie]
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 自 2026-09-29 起只同步版本检测 JSON（实测 Gitee 匿名下载大文件返回 403，APP 无登录环节，APK 兜底实际不可用）；
      # APK 下载统一走 GitHub raw。孤儿提交顺带清掉 Gitee 上残留的历史 APK 目录。
      - name: Push update JSON to Gitee (quota-safe)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO_NAME="${{ github.event.repository.name }}"
          DST="https://dovisliu:${GITEE_TOKEN}@gitee.com/dovisliu/${REPO_NAME}.git"

          # Actions 运行器默认无 git 身份，commit 前必须设置
          git config user.email "bot@firefly.local"
          git config user.name "Firefly Bot"

          # 构建只含版本检测 JSON 的孤儿提交（不推任何 APK）
          git checkout --orphan gitee-latest
          git rm -rf --cached .
          git add apk/leanback.json apk/mobile.json
          git commit -m "update json sync (json only, no apk)"

          # 强制推送（覆盖旧历史，旧 APK 对象不可达，由 Gitee GC 回收配额）
          git push --force "$DST" gitee-latest:fireflymovie

          # 清理 Gitee 旧 tag，释放配额
          git ls-remote --tags "$DST" | awk '{print $2}' | sed 's#refs/tags/##' | while read t; do
            git push "$DST" --delete "$t" || true
          done
