name: Mirror to Gitee (latest only)

on:
  push:
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitHub Release (blobless, metadata only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SRC="https://x-access-token:${GH_TOKEN}@github.com/DovisLiu/Release.git"
          # partial clone：不下载 blob，只为后续按需取最新版 APK（约350MB）而非全量历史（约1GB）
          git clone --filter=blob:none --no-checkout --depth 1 "$SRC" /tmp/repo
          cd /tmp/repo

          # 读取最新版本号（来自 JSON 的 name 字段，如 "1.0.3"）
          V=$(git show HEAD:apk/leanback.json | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          echo "Latest version: $V"

          # Actions 运行器默认无 git 身份，commit 前必须设置
          git config user.email "bot@firefly.local"
          git config user.name "Firefly Bot"

          # 按需 checkout 最新版 APK 目录 + JSON（仅 fetch 这四个 blob，不全量下载）
          git checkout HEAD -- "apk/$V" apk/leanback.json apk/mobile.json

          # 构建只含最新版 APK + JSON 的孤儿提交
          # 关键：不累积历史，避免 Gitee 免费版 500MB 单仓上限被撞（旧 APK 永久累积会超限锁仓）
          git checkout --orphan gitee-latest
          git rm -rf --cached .
          git add "apk/$V" apk/leanback.json apk/mobile.json
          git commit -m "latest snapshot: $V"

      - name: Push snapshot to Gitee (quota-safe)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          DST="https://dovisliu:${GITEE_TOKEN}@gitee.com/dovisliu/Release.git"
          cd /tmp/repo
          # 强制推送（覆盖旧历史，旧 APK 对象不可达，由 Gitee GC 回收配额）
          git push --force "$DST" gitee-latest:fireflymovie
          # 清理 Gitee 旧 tag，释放配额
          git ls-remote --tags "$DST" | awk '{print $2}' | sed 's#refs/tags/##' | while read t; do
            git push "$DST" --delete "$t" || true
          done
