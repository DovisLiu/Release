name: Sync Release Notes to FireflyMovie

# 单一真相源方案（链接型）：Release 仓库的 apk/ 是唯一真相源。
# 每次把新 APK 推到本仓库（fireflymovie 分支）即触发本工作流。
# 不再上传 350MB 的 APK 附件（避免跨境传输），改为：
#   - GitHub 侧：用 FIREFLY_PAT 更新 DovisLiu/FireflyMovie 发行版说明（仅含 github.com 绝对下载链接）
#   - Gitee  侧：用 GITEE_TOKEN  更新 dovisliu/FireflyMovie 发行版说明（仅含 gitee.com  绝对下载链接）
# 两侧链接各自指向自家 Release 仓库的 apk/ 目录，互不串台。
on:
  push:
    paths:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: 更新 GitHub / Gitee FireflyMovie 发行版（仅链接）
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FIREFLY_PAT }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成两侧发行说明
        id: gen
        run: |
          set -e
          python3 - <<'PY'
          import json
          d = json.load(open('apk/leanback.json'))
          name = d['name']
          desc = d.get('desc', '')
          gh_base = f"https://github.com/DovisLiu/Release/raw/fireflymovie/apk/{name}"
          ge_base = f"https://gitee.com/dovisliu/Release/raw/fireflymovie/apk/{name}"
          apks = [
              ("电视版 64 位", "leanback-arm64_v8a.apk"),
              ("电视版 32 位", "leanback-armeabi_v7a.apk"),
              ("手机版 64 位", "mobile-arm64_v8a.apk"),
              ("手机版 32 位", "mobile-armeabi_v7a.apk"),
          ]

          def table(base):
              rows = "\n".join(f"| {label} | [{fn}]({base}/{fn}) |" for label, fn in apks)
              return f"| 版本 | 下载链接 |\n|------|----------|\n{rows}"

          gh_notes = f"流萤影视 v{name}\n\n{desc}\n\n## 下载（GitHub 网络）\n\n{table(gh_base)}\n\n各链接指向 GitHub 的 Release 仓库，请直接点击下载。"
          ge_notes = f"流萤影视 v{name}\n\n{desc}\n\n## 下载（Gitee 网络）\n\n{table(ge_base)}\n\n各链接指向 Gitee 的 Release 仓库，请直接点击下载。"
          open('/tmp/gh_notes.md', 'w').write(gh_notes)
          open('/tmp/ge_notes.md', 'w').write(ge_notes)
          print("NAME=" + name)
          PY

      - name: 更新 GitHub FireflyMovie 发行版
        run: |
          set -e
          NAME=$(python3 -c "import json;print(json.load(open('apk/leanback.json'))['name'])")
          TAG="v$NAME"
          echo "GitHub 发行版 tag: $TAG"
          REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/DovisLiu/FireflyMovie/releases/tags/$TAG")
          REL_ID=$(echo "$REL" | jq -r '.id // empty')
          if [ -n "$REL_ID" ]; then
            echo "已存在（release id=$REL_ID），删除旧 APK 附件并改写为链接说明"
            echo "$REL" | jq -r '.assets[] | select(.name|test("apk$")) | .id' | while read -r AID; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/DovisLiu/FireflyMovie/releases/assets/$AID")
              echo "  删除附件 id=$AID -> HTTP $CODE"
            done
            gh release edit "$TAG" --repo DovisLiu/FireflyMovie --notes-file /tmp/gh_notes.md
          else
            echo "创建发行版并写入链接说明"
            gh release create "$TAG" --repo DovisLiu/FireflyMovie --title "$TAG" --notes-file /tmp/gh_notes.md --target main
          fi
          echo "GitHub 侧完成。"

      - name: 更新 Gitee FireflyMovie 发行版
        run: |
          set -e
          NAME=$(python3 -c "import json;print(json.load(open('apk/leanback.json'))['name'])")
          TAG="v$NAME"
          GE_NOTES=$(jq -Rs . /tmp/ge_notes.md)
          echo "Gitee 发行版 tag: $TAG"
          EXISTING=$(curl -s -H "Authorization: token $GITEE_TOKEN" "https://gitee.com/api/v5/repos/dovisliu/FireflyMovie/releases/tags/$TAG")
          RID=$(echo "$EXISTING" | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            echo "已存在（id=$RID），更新说明"
            curl -s -X PATCH -H "Authorization: token $GITEE_TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":$GE_NOTES,\"target_commitish\":\"main\"}" \
              "https://gitee.com/api/v5/repos/dovisliu/FireflyMovie/releases/$RID" >/dev/null
          else
            echo "创建发行版并写入链接说明"
            curl -s -X POST -H "Authorization: token $GITEE_TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":$GE_NOTES,\"target_commitish\":\"main\"}" \
              "https://gitee.com/api/v5/repos/dovisliu/FireflyMovie/releases" >/dev/null
          fi
          echo "Gitee 侧完成。"
